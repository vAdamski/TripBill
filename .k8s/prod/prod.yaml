apiVersion: v1
kind: Namespace
metadata:
  name: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-bill-config
  namespace: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
data:
  API_PORT: "3000"
  PG_POOL_SIZE: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-bill-api
  namespace: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trip-bill
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trip-bill
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: api
          image: harbor.home.arpa/trip-bill/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: trip-bill-config
                  key: API_PORT
            - name: PG_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: trip-bill-config
                  key: PG_POOL_SIZE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trip-bill-db-secret
                  key: DATABASE_URL
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trip-bill
                    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-bill-frontend
  namespace: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trip-bill
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trip-bill
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: frontend
          image: harbor.home.arpa/trip-bill/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trip-bill
                    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: trip-bill-frontend
  namespace: trip-bill
  labels:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trip-bill
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trip-bill
  namespace: trip-bill
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trip-bill.pl
      secretName: trip-bill-tls
  rules:
    - host: trip-bill.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trip-bill-frontend
                port:
                  number: 80